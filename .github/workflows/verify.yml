name: Verify

# Runs the full `pnpm verify` on every pull request and every push to main
# (ADR 0015), and checks pull requests for changesets (ADR 0021). The job
# names are the required status checks, so keep them `verify` and `changeset`.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel a superseded run on the same pull request, but let every run on main
# finish, so each commit on main keeps its own result.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The pinned Playwright image of .github/ci-image/Dockerfile, with the
    # browsers and their system libraries preinstalled, so nothing is
    # downloaded or installed with apt. A test in test/ci-image.test.js keeps
    # this image equal to the Dockerfile's, and its Playwright version equal
    # to the lockfile's. User 1001 owns the runner's workspace, and Firefox
    # won't start as root with a home directory owned by another user.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --user 1001 --ipc=host --init
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # Installs the pnpm version in `packageManager` and caches its store.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      # Browser tests run on Chromium, Firefox and WebKit (ADR 0015), with the
      # browsers the image provides.
      - run: pnpm verify

  # Fails a pull request that changes a published package's source or
  # package.json without a changeset (ADR 0021). Which files count is set by
  # changedFilePatterns in .changeset/config.json. The version pull request
  # consumes changesets by design, so it's skipped.
  changeset:
    name: changeset
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history, so that origin/main is there to compare against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm changeset status --since=origin/main
