name: PR title

# The squash commit on main takes its message from the pull request title, so
# the title must be a valid Conventional Commit (ADR 0016).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

# No concurrency group, on purpose. Pushing and then editing the description
# starts two runs for the same commit, and cancelling one leaves a cancelled
# required check on that commit, which blocks the merge. A group with
# cancel-in-progress: false doesn't help, because a newer queued run still
# cancels a pending one. The job finishes in seconds, so letting every run
# complete costs nothing.

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in "{title}" must start with a lowercase letter.
